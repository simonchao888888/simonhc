# 發布網站：建置後推到 gh-pages 分支，Cloudflare Worker「simonhc」讀這個分支對外提供 simonhc.com（見 cloudflare/worker.js）
# main 有新 commit、或每週更新完成後自動執行
name: Deploy
on:
  push:
    branches: [main]
  workflow_run:            # 每週更新是機器人 push，不會觸發 push 事件，所以在它跑完後發布
    workflows: [Weekly update, Update data, Update news, Fetch images]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    # 每小時快訊若沒有新內容就不重新發布
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://simonhc.com' }}
      - name: 保留上一版的樣式與程式檔（瀏覽器若還暫存舊網頁，舊網頁要用的檔案仍然讀得到）
        run: |
          git fetch -q --depth 1 origin gh-pages || exit 0
          mkdir -p dist/_astro
          git archive FETCH_HEAD _astro | tar -x -C /tmp && cp -n /tmp/_astro/* dist/_astro/ || true
          ls dist/_astro | wc -l
          # 帶雜湊檔名的 site.*.js、visits.*.js 也保留上一版（邊緣快取的舊 HTML 5 分鐘內仍會引用）
          for f in $(git ls-tree --name-only FETCH_HEAD | grep -E '^(site|visits)\.[0-9a-f]{10}\.js$'); do [ -e "dist/$f" ] || git show "FETCH_HEAD:$f" > "dist/$f"; done
      - name: 推到 gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "發布 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
