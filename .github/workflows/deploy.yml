# 部署到 GitHub Pages（網域 simonhc.com，DNS 在 Cloudflare）
# main 有新 commit、或每週更新完成後，自動建置並發布
# 第一次使用：GitHub 專案 Settings → Pages → Source 選「GitHub Actions」
# 並在 Settings → Secrets and variables → Actions → Variables 新增 SITE_URL（你的網址）
name: Deploy
on:
  push:
    branches: [main]
  workflow_run:            # 每週更新是機器人 push，不會觸發 push 事件，所以在它跑完後發布
    workflows: [Weekly update, Update data, Update news]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://simonhc.com' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
