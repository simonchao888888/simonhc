# 發布網站：建置後推到 gh-pages 分支，Cloudflare Worker「simonhc」讀這個分支對外提供 simonhc.com（見 cloudflare/worker.js）
# main 有新 commit、或每週更新完成後自動執行
name: Deploy
on:
  push:
    branches: [main]
  workflow_run:            # 每週更新是機器人 push，不會觸發 push 事件，所以在它跑完後發布
    workflows: [Weekly update, Update data, Update news]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://simonhc.com' }}
      - name: 推到 gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "發布 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
