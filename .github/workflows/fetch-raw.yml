# 手動執行：下載新竹縣市實價登錄原始檔（2023 年起），供資料核對與移轉棟數統計
name: Fetch raw LVR
on:
  workflow_dispatch:
    inputs:
      start: { description: '起始季（民國年S季）', default: '112S1' }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/fetch_raw.py --from ${{ inputs.start }} --out raw
      - uses: actions/upload-artifact@v4
        with: { name: lvr-raw, path: raw/, retention-days: 7 }
